name: Unsigned iOS IPA

on:
  push:
    branches: [main]

concurrency:
  group: voicegen-ios-unsigned
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild -list -project Voicegen.xcodeproj
      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Voicegen.xcodeproj \
            -scheme Voicegen \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/DerivedData/Build/Products/Release-iphoneos/Voicegen.app"
          test -d "$app"
          plist="$app/Info.plist"
          test -f "$plist"
          plutil -lint "$plist"
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$plist")
          identifier=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          package_type=$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$plist")
          test "$identifier" = "app.voicegen.offline"
          test "$package_type" = "APPL"
          test -n "$executable"
          test "$executable" != "(null)"
          test -f "$app/$executable"
          file "$app/$executable"
          xcrun lipo -archs "$app/$executable" | grep -qw arm64
          echo "Validated $identifier / $executable (arm64)"
          mkdir -p build/export/Payload
          ditto "$app" build/export/Payload/Voicegen.app
          (cd build/export && zip -qry Voicegen-unsigned.ipa Payload)
          unzip -t build/export/Voicegen-unsigned.ipa | tail -1
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Voicegen-unsigned-ipa
          path: build/export/Voicegen-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Voicegen-xcode-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
